name: rf-first-principles
description: 第一性原理解读与分析。把复杂事物拆解到不可再分的根本问题，建立可迁移的心智模型。

inputs:
  subject: 要解读的主题/问题/内容（可附 URL、路径或粘贴文本）
  mode: 可选，默认为完整拆解

outputs:
  insight: 一句话核心洞察
  questions: 根本问题表（根本问题 + 通俗说法 + 答案 + 常用度）
  breakdown: 逐个根本问题的拆解（第一性答案 → 现有方案 → 取舍分化）
  mental_model: 一句话心智模型 + 速读法 + 关键易错点
  boundaries: 事实/推断区分 + 不确定与争议

behavior:
  - 从表象剥离，追问到不可再分的根本问题
  - 根本问题彼此正交、合在一起完备覆盖领域
  - 输出「根本问题 → 答案」映射表
  - 区分地基/进阶/冷门，帮助用户分配注意力
  - 诚实标注不确定与边界
  - 讲解完成后主动询问是否存为笔记

exclusions:
  - 不记忆结论，而是建立可迁移的心智模型
  - 不对约定俗成的内容强行拆解
  - 不为了显得深刻而过度拆解简单事物
