name: rf-adversarial-review
description: 对抗式审查。强制站到对立面，主动构造攻击向量去击穿审查对象，找破绽、盲区、漏洞和反例。

inputs:
  target: 审查对象（代码路径/目录、文章、方案描述、决策描述）
  scope: 可选，指定审查范围或特定关注点

outputs:
  break_goal: 破坏目标声明
  summary: 一句话整体健壮性判断
  threats: 确认的威胁列表（致命/严重/一般，含破绽/证据/后果/加固）
  false_positives: 排除的伪问题及原因（≥3 条）
  uncovered: 未覆盖的攻击面（必填）
  priority: 加固优先级排序

behavior:
  - 强制立场对立，站在攻击者视角构造攻击向量
  - 从 6 个正交维度枚举破坏场景（极端输入/边界并发/失败恢复/恶意滥用/逻辑事实/时间演化）
  - 走通每条攻击路径，区分真威胁和伪问题
  - 宁可少而准，不堆砌假阳性
  - 对重要对象建议并发多 agent 对抗

exclusions:
  - 不做顺向确认性审查
  - 不堆砌假阳性充数
  - 不跳过「未覆盖攻击面」的显式声明
